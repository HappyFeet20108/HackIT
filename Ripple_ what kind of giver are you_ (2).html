  const mo=[15,30,60,90,120,180].map(m=>`<option value="${m}" ${m==60?"selected":""}>${m>=60?(m/60)+" hr":m+" min"}</option>`).join("");
  return `<div class="card streak"><b>${s.streak?"🔥":"❄️"}${s.streak}</b><div><h2>${s.streak==1?"week":"weeks"} in a row</h2><p style="margin:0" class="mute">${s.streak?"Log something this week to keep it going.":"Log an activity to start your streak."}</p></div></div>
  <div class="card"><h3>Last 8 weeks</h3>${strip()}</div>
  <div class="grid"><div class="stat"><b>${h}</b><span>hours given</span></div><div class="stat"><b>${s.n}</b><span>activities</span></div><div class="stat"><b>${s.causes}</b><span>causes tried</span></div><div class="stat"><b>${s.comms}</b><span>communities helped</span></div></div>
  ${byc()}${S.going.length?`<div class="card"><h2>Coming up</h2>${E.filter(e=>S.going.includes(e[0])).map(e=>`<div class="log"><h3>${esc(e[3])}</h3><small>${esc(e[6])}${e[5]?", "+esc(e[5]):""}</small><p style="margin:8px 0 0"><button class="btn sm" data-a="did" data-id="${e[0]}">I went, log it</button></p></div>`).join("")}</div>`:""}
  <div class="card"><h2>Log an activity</h2>
    <label for="f-cause">Cause</label><select id="f-cause">${opts}</select>
    <label for="f-what">What did you do?</label><input id="f-what" maxlength="90" placeholder="e.g. Helped at a community garden">
    <div class="two"><div><label for="f-mins">Time</label><select id="f-mins">${mo}</select></div><div><label for="f-date">Date</label><input id="f-date" type="date" value="${today()}" max="${today()}"></div></div>
    <label for="f-comm">Community it helped (optional)</label><select id="f-comm"><option value="">None</option>${Object.entries(CM).map(c=>`<option value="${c[0]}">${esc(c[1])}</option>`).join("")}</select>
    <label for="f-note">What did you notice or learn?</label><textarea id="f-note" placeholder="A sentence is enough."></textarea>
    ${msg?`<p class="err" role="alert">${esc(msg)}</p>`:""}<p></p><button class="btn" data-a="log">Save activity</button></div>
  <div class="card"><h2>Your journey</h2>${S.logs.length?[...S.logs].sort((a,b)=>b.date.localeCompare(a.date)).map(l=>`<div class="log"><h3>${esc(l.what)}</h3><small>${esc(C[l.cause])}, ${l.mins} min, ${esc(l.date)}${l.comm?", "+esc(CML[l.comm]):""}</small>${l.note?`<q>${esc(l.note)}</q>`:""}</div>`).join(""):"<p>Nothing logged yet. Tap I did this on a feed card, or log something you already did.</p>"}</div>
  <div class="row foot"><button class="btn alt sm" data-a="sample">Load sample data</button><button class="btn alt sm" data-a="reset">Clear everything</button></div>`;
}

function render(){
  ["quiz","feed","journey","rewards"].forEach(v=>document.getElementById("t-"+v).setAttribute("aria-selected",view==v));
  document.getElementById("app").innerHTML={quiz,feed,journey,rewards}[view]();
  if(view=="rewards"){drawCard();if(document.fonts)document.fonts.ready.then(drawCard)}
  const p=prog(),u=BG.filter(b=>{const[v,t]=b[3](p.s);return v>=t}).map(b=>b[1]),lv=document.getElementById("lvl");
  if(lv)lv.textContent="Lv "+(p.i+1)+" · "+p.xp+" XP";
  if(seen){const nb=u.filter(x=>!seen.b.includes(x));if(nb.length){toast("Badge unlocked: "+nb.join(", "));confetti()}else if(p.i>seen.l){toast("Level up: "+LV[p.i][0]);confetti()}}
  seen={b:u,l:p.i};
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,d=b.dataset;
  if(a=="tab"){view=d.v;msg="";window.scrollTo(0,0)}
  else if(a=="start"){step=0}
  else if(a=="ans"){S.ans[step]=+d.i;if(step==N-1){S.res=score();save();msg=""}else step++}
  else if(a=="back"){step--}
  else if(a=="retake"){S.res=null;S.ans=[];step=0;msg="";save()}
  else if(a=="flt"){flt=d.v;msg=""}
  else if(a=="srt"){srt=d.v}
  else if(a=="lbs"){lbs=d.v}
  else if(a=="lbjoin"){const c=document.getElementById("l-cls").value.trim();if(!c){msg="Enter your class name to join.";render();return}S.lb={on:true,cls:c,sch:document.getElementById("l-sch").value.trim()};msg="";save()}
  else if(a=="lbleave"){S.lb={on:false,cls:"",sch:""};save()}
  else if(a=="savecard"){saveCard()}
  else if(a=="copystats"){const p=prog(),r=S.res,h=(p.s.mins/60).toFixed(1).replace(".0",""),t=(r?"I'm "+P[r.p][0]+" on Ripple. ":"On Ripple: ")+h+" hrs given, "+p.s.causes+" causes, level "+(p.i+1)+", "+p.bd+" badges. What's your giving type?";msg="Copied to your clipboard.";try{navigator.clipboard.writeText(t).catch(()=>{msg=t;render()})}catch(x){msg=t}}
  else if(a=="len"){lenf=lenf==d.v?"any":d.v}
  else if(a=="ftf"){ftf=!ftf}
  else if(a=="comm"){const i=S.comm.indexOf(d.v);i<0?S.comm.push(d.v):S.comm.splice(i,1);save()}
  else if(a=="pref"){S.pref[d.k]=S.pref[d.k]==d.v?null:d.v;save()}
  else if(a=="setupdone"){S.setup=true;view="feed";save();window.scrollTo(0,0)}
  else if(a=="editprefs"){S.setup=false;view="quiz";save();window.scrollTo(0,0)}
  else if(a=="idea"){S.logs.push({cause:d.k,what:d.t,mins:60,date:today(),note:"",comm:d.c});msg="Added to your journey.";save()}
  else if(a=="save"||a=="go"){const k=a=="save"?"saved":"going",i=S[k].indexOf(d.id);i<0?S[k].push(d.id):S[k].splice(i,1);msg=a=="go"&&i<0?"Added to Coming up in your journey.":"";save()}
  else if(a=="share"){const e=E.find(x=>x[0]==d.id),t=e[3]+" "+e[8];msg="Link copied.";try{navigator.clipboard.writeText(t).catch(()=>{})}catch(x){msg=t}}
  else if(a=="did"){const e=E.find(x=>x[0]==d.id);S.logs.push({cause:e[1],what:e[3],mins:120,date:today(),note:"",comm:TG[e[0]][0].split(",").find(c=>S.comm.includes(c))||""});S.going=S.going.filter(i=>i!=d.id);msg="";save()}
  else if(a=="copy"){const r=S.res,t="I'm "+P[r.p][0]+" ("+ST[r.style][0]+") on Ripple. "+P[r.p][1];msg="Copied to your clipboard.";try{navigator.clipboard.writeText(t).catch(()=>{})}catch(x){msg=t}}
  else if(a=="log"){
    const what=document.getElementById("f-what").value.trim();
    if(!what){msg="Add a short description of what you did.";render();return}
    S.logs.push({cause:document.getElementById("f-cause").value,what,comm:document.getElementById("f-comm").value,mins:+document.getElementById("f-mins").value,date:document.getElementById("f-date").value||today(),note:document.getElementById("f-note").value});
    msg="";save();
  }
  else if(a=="sample"){
    const x=n=>{const t=new Date();t.setDate(t.getDate()-n);return t.toLocaleDateString("en-CA")};
    S.logs=[{cause:"seniors",what:"Phone skills session at a community club",mins:90,date:x(0),comm:"hood",note:"Mdm Tan learned to video call her grandson. Patience matters more than speed."},{cause:"env",what:"East Coast Park clean-up",mins:120,date:x(8),comm:"cca",note:"Surprised by how much plastic was just under the sand."},{cause:"digital",what:"Fixed a small charity's booking page",mins:180,date:x(15),comm:"school",note:"Used what we learnt in class for something real."},{cause:"seniors",what:"Weekly befriending call",mins:30,date:x(22),note:""}];
    save();
  }
  else if(a=="reset"){if(confirm("Clear your quiz result and journey?")){S={ans:[],res:null,logs:[],saved:[],going:[],comm:[],pref:{},setup:false,lb:{on:false,cls:"",sch:""}};step=-1;msg="";save()}}
  render();
});
if(S.res)step=N;
render();
</script>
</body>
</html>
